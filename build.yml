name: Build SoulKut

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DSOULKUT_COPY=FALSE

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSOULKUT_COPY=FALSE -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Envoi du plugin
        uses: actions/upload-artifact@v4
        with:
          name: SoulKut-${{ runner.os }}-VST3
          path: build/SoulKut_artefacts/Release/VST3/
